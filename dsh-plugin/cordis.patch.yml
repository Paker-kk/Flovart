# @flovart/dsh-plugin bundle patch layer.
#
# Applied after the dsh-base and dsh-web-app bundle layers of the `flovart`
# profile (see $DSH_HOME/profiles/flovart/package.json → dsh.profile.bundles).
# One row provides both halves of the plugin:
#   - the Node/Cordis half (`@flovart/dsh-plugin` main entry) registers the
#     `flovart` service (CLI discovery + runtime status) and derives model
#     tools from `flovart command.list` / `command.schema`, executing every
#     call through the public CLI facade (`Flovart CLI 门面`);
#   - the browser half (`exports["./client"]`, discovered through the
#     `dsh.client` manifest declaration) registers the additive
#     `conversation.view` (native Flovart Workflow canvas) and
#     `shell.overlay` (status/approval/Artifact light overlays).
#
# RC8 boundary: we never occupy the exclusive root `sidebar`, root
# `conversation` or `conversation.session` slots. The session-scoped view is a
# native React canvas and talks to the authenticated local Workspace Operator
# through a narrow same-origin host proxy. The Workspace token never enters the
# browser bundle.
#
# The row config is evaluated at row start, so it only reads process.env
# (same proven idiom as the web-app layer's DSH_TOOLS_MODE seam). A future
# slice may move the discovered origin into a service-backed expression once
# a multi-row/single-bundle instance layout is validated against a real RC8
# install.

- insert:
    - id: flovart
      name: '@flovart/dsh-plugin'
      inject:
        - tools
        - webServer
      config:
        # The launcher prepares this authenticated loopback Workspace Operator.
        # The host keeps these values private and proxies only four native-view routes.
        workspaceUrl: !!js process.env.FLOVART_WORKSPACE_URL ?? 'http://127.0.0.1:17372'
        workspaceToken: !!js process.env.FLOVART_WORKSPACE_TOKEN ?? ''
        cli: !!js process.env.FLOVART_CLI ?? 'flovart'
        workspaceMode: !!js process.env.FLOVART_WORKSPACE_MODE ?? 'browser'
        toolTimeoutMs: 30000
