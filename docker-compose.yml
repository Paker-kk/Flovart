services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flovart
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flovart"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub:
    build: ./backend
    environment:
      PORT: "11452"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/flovart?sslmode=disable"
      JWT_SECRET: "flovart-dev-secret-change-in-production"
      JWT_EXP_HOURS: "168"
      CORS_ALLOW: "*"
    ports:
      - "11452:11452"
    depends_on:
      db:
        condition: service_healthy

  enterprise:
    build: ./backend/enterprise
    environment:
      ENTERPRISE_PORT: "11453"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/flovart?sslmode=disable"
      JWT_SECRET: "flovart-dev-secret-change-in-production"
      CORS_ALLOW: "*"
    ports:
      - "11453:11453"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "1635:1635"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HUB_BASE_URL: "http://localhost:11452/api/v1"
      VITE_ENTERPRISE_BASE_URL: "http://localhost:11453/api/v1/enterprise"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - hub
      - enterprise

volumes:
  db-data:
