# Flovart - 每日仓库数据快照
#
# GitHub Traffic API 只保留最近 14 天数据，本工作流每天抓取并累积到 stats/history.json。
# views / clones 需要 TRAFFIC_PAT：推荐 Fine-grained PAT，仅授权本仓库的 Administration: read。
# 未配置时降级为只记录 stars / forks / watchers / releases / release 下载量。
# 这里不采集 Flovart 应用内行为、Prompt、素材或 API Key。

name: Traffic Snapshot

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect stats
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TRAFFIC_PAT || github.token }}
          script: |
            const fs = require('fs');
            const path = 'stats/history.json';
            const { owner, repo } = context.repo;
            const history = fs.existsSync(path)
              ? JSON.parse(fs.readFileSync(path, 'utf8'))
              : { schemaVersion: 1, views: {}, clones: {}, snapshots: [], releaseAssets: [] };

            history.schemaVersion ||= 1;
            history.views ||= {};
            history.clones ||= {};
            history.snapshots ||= [];

            // Traffic API 只返回最近 14 天；每天合并后可形成长期趋势。
            for (const kind of ['views', 'clones']) {
              try {
                const { data } = await github.request(`GET /repos/{owner}/{repo}/traffic/${kind}`, { owner, repo });
                for (const day of data[kind]) {
                  history[kind][day.timestamp.slice(0, 10)] = { count: day.count, uniques: day.uniques };
                }
              } catch (e) {
                core.warning(`跳过 ${kind}: ${e.message}（需要为 TRAFFIC_PAT 配置 Administration: read）`);
              }
            }

            const { data: info } = await github.rest.repos.get({ owner, repo });
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const releaseAssets = releases
              .flatMap(release => release.assets.map(asset => ({
                release: release.tag_name,
                name: asset.name,
                downloads: asset.download_count,
                updatedAt: asset.updated_at,
              })))
              .sort((a, b) => b.downloads - a.downloads);
            const downloads = releaseAssets.reduce((sum, asset) => sum + asset.downloads, 0);

            const today = new Date().toISOString().slice(0, 10);
            history.snapshots = history.snapshots.filter(s => s.date !== today);
            history.snapshots.push({
              date: today,
              stars: info.stargazers_count,
              forks: info.forks_count,
              watchers: info.subscribers_count,
              releases: releases.length,
              downloads,
            });
            history.snapshots.sort((a, b) => a.date.localeCompare(b.date));
            history.releaseAssets = releaseAssets;
            history.updatedAt = new Date().toISOString();

            fs.mkdirSync('stats', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(history, null, 2) + '\n');

            await core.summary
              .addHeading('Flovart repository snapshot')
              .addTable([
                [{ data: 'Metric', header: true }, { data: 'Value', header: true }],
                ['Stars', String(info.stargazers_count)],
                ['Forks', String(info.forks_count)],
                ['Watchers', String(info.subscribers_count)],
                ['Releases', String(releases.length)],
                ['Release asset downloads', String(downloads)],
              ])
              .addRaw('Traffic views and clones are included only when TRAFFIC_PAT is authorized.')
              .write();

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/history.json
          git diff --cached --quiet || git commit -m "chore: daily traffic snapshot"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
