name: Legacy Release (retired)

# This workflow is intentionally non-publishing. Keep the filename as a
# redirect for old bookmarks; all real builds and releases go through
# build-desktop.yml, whose tag path is draft-first and release-gated.
on:
  workflow_dispatch:

jobs:
  redirect:
    name: Use Build Desktop workflow
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired workflow
        run: echo 'This legacy workflow no longer builds or publishes artifacts. Use Build Desktop.'
