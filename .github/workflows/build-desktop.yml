# Flovart - Tauri 桌面应用全平台构建 + 自动发布
#
# 触发条件：
#   1. 推送到 main          → 出 Prerelease  (nightly 频道)
#   2. 推送 v* tag         → 出正式 Release  (stable 频道)
#   3. workflow_dispatch   → 手动触发，默认 Prerelease
#
# 构建矩阵：Windows x64 / Linux x64（macOS 暂不占用 CI 配额）
#
# 必须在 GitHub Repo Settings → Secrets 中配置：
#   TAURI_SIGNING_PRIVATE_KEY         - 自动更新签名私钥（src-tauri/.tauri_private_key 文件内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - 私钥密码（生成时无密码则留空）
#
# 包含组件：
#   - Flovart 主程序（React 19 + Tauri 2）
#   - flovart-host 启动器（Chrome / Edge Native Messaging 宿主，源在 src/bin/host.rs）
#   - 平台原生安装包（Windows: NSIS .exe，Linux: .deb / .AppImage）
#
# Sidecar 编译：
#   src-tauri/binaries/ 已在 .gitignore 排除（只有 Windows binary 会破坏跨平台构建），
#   每个 job 在 tauri build 之前会从 src/bin/host.rs 编译对应 target 的 sidecar。

name: Build Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: '标记为 Prerelease（nightly 频道）'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write
  attestations: write

# 串行跑同一组的 job，避免 prerelease 标签 race condition
concurrency:
  group: 'desktop-build'
  cancel-in-progress: false

jobs:
  # A version tag may create only a draft release until every local release
  # gate and artifact-integrity step has completed. This prevents a partially
  # built tag from becoming a public release.
  release-gate:
    name: Release gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Docs contract
        run: npm run docs:check

      - name: Release red-team invariants
        run: npm run release:red-team

      - name: Tracked secret audit
        run: npm run release:secret-audit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test -- --reporter=dot

      - name: Web build
        run: npm run build

      - name: Browser extension build
        run: npm run ext:build

      - name: DSH plugin build
        run: npm --prefix dsh-plugin run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Critical suite repeated ten times
        run: npm run test:critical

      - name: Git diff check
        run: git diff --check

  security-gate:
    name: Hosted security gate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  build:
    name: Build ${{ matrix.label }}
    needs: [release-gate, security-gate]
    if: ${{ always() && (needs.release-gate.result == 'success' || needs.release-gate.result == 'skipped') && (needs.security-gate.result == 'success' || needs.security-gate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            binary_name: flovart-host.exe
            sidecar_ext: .exe
            bundle_args: --bundles nsis
            installer_glob: |
              **/*.exe
              **/*.msi
            label: Windows x64
          # macOS runner 是 10x minutes multiplier（极费配额），
          # 暂时只跑 Windows + Linux。macOS 在本地 / 推 tag 时手跑。
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            binary_name: flovart-host
            sidecar_ext: ''
            bundle_args: --bundles deb,appimage
            installer_glob: |
              **/*.deb
              **/*.AppImage
            label: Linux x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux 桌面环境依赖 ──
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Node + Rust 工具链 ──
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.rust_target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Verify tagged release versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-version.mjs "${{ github.ref_name }}"

      # ── Sidecar pre-build ──
      # 从 src/bin/host.rs 编译 flovart-host（Chrome Native Messaging 宿主），
      # 放到 src-tauri/binaries/，文件名带 target triple 后缀，供 Tauri externalBin 查找。
      - name: Build sidecar flovart-host
        working-directory: src-tauri
        shell: bash
        run: |
          cargo build --bin flovart-host --target ${{ matrix.rust_target }} --release
          mkdir -p binaries
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}" \
             "binaries/flovart-host-${{ matrix.rust_target }}${{ matrix.sidecar_ext }}"
          echo "=== Sidecar ready ==="
          ls -la binaries/
          file binaries/* 2>/dev/null || true

      # ── Tauri build + 自动签名 + 创建 release ──
      # prerelease 表达式：push 到 main 分支 → nightly；tag → stable；手动触发 → 按 input。
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            {
              echo "is_tag=true"
              echo "tag_name=${GITHUB_REF_NAME}"
              echo "release_name=Flovart ${GITHUB_REF_NAME}"
              echo "release_body<<EOF"
              echo "## Flovart Stable Release / 正式版"
              echo ""
              echo "**English:**"
              echo "- Flovart main app + flovart-host launcher (Chrome / Edge Native Messaging host)"
              echo "- Windows + Linux installers (macOS is currently excluded from CI quota) with multi-language NSIS on Windows (EN / 简中 / 繁中 / 日 / 韩 / FR / DE / ES / IT / PT-BR / RU)"
              echo "- Signed auto-update artifacts"
              echo ""
              echo "**简体中文：**"
              echo "- 包含 Flovart 主程序 + flovart-host 启动器（Chrome / Edge 原生消息宿主）"
              echo "- Windows + Linux 安装包（macOS 暂不占用 CI 配额），Windows NSIS 安装器支持 11 种语言（英 / 简中 / 繁中 / 日 / 韩 / 法 / 德 / 西 / 意 / 葡 / 俄）"
              echo "- 已签名自动更新产物"
              echo "EOF"
              echo "prerelease=false"
              echo "updater=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "is_tag=false"
              echo "tag_name=nightly-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
              echo "release_name=Flovart Nightly v__VERSION__ (build #${GITHUB_RUN_NUMBER})"
              echo "release_body<<EOF"
              echo "## Flovart Nightly Build / 预发布版"
              echo ""
              echo "**English:**"
              echo "- Flovart main app + flovart-host launcher"
              echo "- Windows + Linux installers (macOS disabled in CI for quota)"
              echo "- Multi-language NSIS installer (EN / 简中 / 繁中 / 日 / 韩 / FR / DE / ES / IT / PT-BR / RU)"
              echo "- This is a pre-release, may be unstable"
              echo ""
              echo "**简体中文：**"
              echo "- 包含 Flovart 主程序 + flovart-host 启动器"
              echo "- 提供 Windows + Linux 安装包（macOS 暂未在 CI 构建，省配额）"
              echo "- NSIS 安装器支持 11 种语言（英 / 简中 / 繁中 / 日 / 韩 / 法 / 德 / 西 / 意 / 葡 / 俄）"
              echo "- 这是预发布版本，可能不稳定"
              echo "EOF"
              echo "prerelease=true"
              echo "updater=false"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "=== GITHUB_OUTPUT ==="
          cat "$GITHUB_OUTPUT"

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag_name }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: ${{ steps.meta.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          includeUpdaterJson: ${{ steps.meta.outputs.updater }}
          args: --target ${{ matrix.rust_target }} ${{ matrix.bundle_args }}

      # 将 Tauri 产物收敛到稳定目录，供 checksum、SBOM 和 provenance 使用。
      # 只复制 bundle 目录中的安装包，避免把 sidecar 当作发布物。
      - name: Stage Windows release artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $installerDir = Join-Path $PWD 'dist/release-artifacts/installers'
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          $files = Get-ChildItem -LiteralPath 'src-tauri/target' -Recurse -File |
            Where-Object {
              $_.FullName -match '\\bundle\\(nsis|msi)\\' -and
              @('.exe', '.msi') -contains $_.Extension.ToLowerInvariant() -and
              $_.Name -notlike '*.sig'
            }
          if (-not $files) { throw 'No Windows installer was produced under src-tauri/target/**/bundle.' }
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $installerDir $file.Name) -Force
          }
          $hashLines = foreach ($file in Get-ChildItem -LiteralPath $installerDir -File | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $hashLines | Set-Content -LiteralPath (Join-Path $installerDir '..\\SHA256SUMS.txt') -Encoding ascii

      - name: Stage Linux release artifacts
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          installer_dir="dist/release-artifacts/installers"
          mkdir -p "$installer_dir"
          mapfile -t files < <(find src-tauri/target -type f \( -name '*.deb' -o -name '*.AppImage' \) -path '*/bundle/*' -print)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo 'No Linux installer was produced under src-tauri/target/**/bundle.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do cp "$file" "$installer_dir/"; done
          (cd "$installer_dir" && sha256sum -- * | sort) > dist/release-artifacts/SHA256SUMS.txt

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ github.workspace }}
          format: spdx-json
          output-file: ${{ github.workspace }}/dist/release-artifacts/flovart-${{ matrix.platform }}-sbom.spdx.json
          artifact-name: flovart-${{ matrix.platform }}-${{ matrix.rust_target }}-sbom
          upload-artifact: false
          upload-release-assets: false

      - name: Attest release artifacts and SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/dist/release-artifacts/installers/*
          sbom-path: ${{ github.workspace }}/dist/release-artifacts/flovart-${{ matrix.platform }}-sbom.spdx.json

      - name: Upload checksums and SBOM to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag_name }}" \
            dist/release-artifacts/SHA256SUMS.txt \
            dist/release-artifacts/flovart-${{ matrix.platform }}-sbom.spdx.json \
            --clobber

      - name: Upload release evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: flovart-${{ matrix.platform }}-${{ matrix.rust_target }}-release-evidence
          path: dist/release-artifacts
          if-no-files-found: error

      - name: Build Windows Agent Toolkit bundle
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm run build:agent-toolkit -- `
            --runtime="src-tauri/target/${{ matrix.rust_target }}/release/flovart.exe" `
            --host="src-tauri/binaries/flovart-host-${{ matrix.rust_target }}.exe" `
            --platform=win32-x64 `
            --version=$version `
            --output=dist/agent-toolkit

      - name: Upload Windows Agent Toolkit assets
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" `
            "dist/agent-toolkit/flovart-agent-toolkit-win32-x64.tar.gz" `
            "dist/agent-toolkit/flovart-agent-toolkit-manifest.json" `
            --clobber

  # Matrix builds upload into a draft. Finalization is deliberately a
  # separate job so one platform cannot publish while another is still
  # building or attesting its artifacts.
  publish-release:
    name: Publish verified release
    needs: build
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release edit "${{ github.ref_name }}" --draft=false
          else
            release_name="nightly-${{ github.run_number }}-${GITHUB_SHA::7}"
            gh release edit "$release_name" --draft=false --prerelease
          fi
