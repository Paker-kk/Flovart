name: Bug 报告
description: 提交可复现的错误、崩溃或行为回归
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并删除日志中的 API Key、Token、私有 URL、Prompt 和素材信息。
  - type: dropdown
    id: surface
    attributes:
      label: 影响范围
      description: 请选择最接近问题发生位置的模块。
      options:
        - Workflow
        - Table
        - Agent
        - Skill / CLI / MCP
        - Desktop / 安装与更新
        - Provider / 模型映射
        - 文档或官网
        - 其他
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 一句话说明什么坏了，以及它阻止了什么任务。
      placeholder: 点击图片节点后没有出现 PromptBar，无法继续图生图。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 从一个可识别的起点开始，按顺序列出最少步骤。
      placeholder: |
        1. 打开……
        2. 创建……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包含稳定出现的错误文案、频率和是否可以恢复。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Flovart 版本或提交、Web/Desktop、浏览器、操作系统。
      placeholder: "Flovart 0.3.0；Desktop；Windows 11"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或脱敏日志
      description: 可直接拖入文件；请勿包含凭据、私人素材或签名链接。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue，没有找到同一问题。
          required: true
        - label: 我已移除 API Key、Token、私人内容和未脱敏日志。
          required: true
